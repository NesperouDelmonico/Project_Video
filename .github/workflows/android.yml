name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Sin keystore de release, el APK se firma con el de debug. Cachearlo mantiene la misma
      # firma entre builds para poder actualizar la app sin desinstalarla.
      - name: Keystore de debug estable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Keystore de release (si hay secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Firmando con el keystore de release."
          else
            echo "::notice::No hay SIGNING_KEYSTORE_BASE64: el APK se firma con el keystore de debug cacheado (ver docs/ci.md)."
          fi

      - name: Compilar, tests y lint
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease testDebugUnitTest lintDebug --stacktrace 2>&1 | tee build.log

      # Convierte los errores del log en anotaciones visibles en el resumen del workflow.
      - name: Resumen de errores
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "^e: |error:|What went wrong|FAILED|Could not resolve|Execution failed" build.log \
              | head -40 \
              | while IFS= read -r line; do
                  clean="${line//%/%25}"
                  echo "::error::${clean}"
                done
          fi

      - name: Preparar APK
        id: apk
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          NAME="ProjectVideo-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "### APK listo: \`$NAME\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Subir reportes de tests y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      # El último build de main queda siempre en el release "nightly", descargable desde el celular.
      - name: Publicar release nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly "$APK" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly #${GITHUB_RUN_NUMBER}" \
            --notes "Build automático del commit ${GITHUB_SHA::7} en main. Instalar el APK adjunto en el celular."
